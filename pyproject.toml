[project]
name = "groundplan"
version = "0.1.0"
description = "Phone capture (photos, video or LiDAR) to a dimensioned, stitched floor plan with damage regions, concealed-damage flags, surface-keyed scope and a calibrated interval on every number."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Shreya" }]
dependencies = [
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "pillow>=10.2",
    "pillow-heif>=0.16",
    "av>=12.0",
    "shapely>=2.0",
    "networkx>=3.2",
    "scikit-image>=0.22",
    "pydantic>=2.6",
    "jsonschema>=4.21",
    "typer>=0.12",
    "rich>=13.7",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Learned components: metric monocular depth (photo/video tiers) and CLIP (damage verification).
models = [
    "torch>=2.3",
    "torchvision>=0.18",
    "transformers>=4.44,<5",
    "huggingface_hub>=0.24",
]
# Structure-from-motion for the video tier.
video = ["pycolmap>=3.10"]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "ruff>=0.6"]

[project.scripts]
groundplan = "groundplan.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundplan"]

[tool.hatch.build.targets.wheel.force-include]
"src/groundplan/calib/calibration.json" = "groundplan/calib/calibration.json"

# CPU-only torch everywhere except macOS (where the default wheel already is CPU/MPS).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end tests that take more than a few seconds",
    "sample: tests that need the assessor sample captures (GROUNDPLAN_SAMPLE_DATA)",
    "models: tests that need the [models] extra and downloaded weights",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
